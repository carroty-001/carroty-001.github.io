<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>당그니 Shop | 당근 소품샵 🥕</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <!-- 헤더 -->
  <header>
    <div class="header-container">
      <h1 class="logo"><i class="fa-solid fa-carrot"></i> 당그니 Shop</h1>
      <nav>
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#products">Products</a></li>
          <li><a href="#about">About</a></li>
        </ul>
      </nav>
      <div class="cart-icon" onclick="toggleCart()">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cart-count">0</span>
      </div>
    </div>
  </header>

  <!-- 히어로 섹션 -->
  <section id="home" class="hero">
    <div class="hero-content">
      <h2>당그니의 주황빛 귀여운 세상 🥕</h2>
      <p>귀여운 당근 굿즈와 통통 튀는 소품들을 만나보세요!</p>
      <a href="#products" class="btn">당근 굿즈 구경하기</a>
    </div>
  </section>

  <!-- 상품 목록 섹션 -->
  <section id="products" class="products-section">
    <h2>🥕 당그니 인기 아이템</h2>
    <div class="product-grid" id="product-grid">
      <!-- JavaScript로 동적 생성됨 -->
    </div>
  </section>

  <!-- 장바구니 모달 -->
  <div id="cart-modal" class="cart-modal">
    <div class="cart-content">
      <div class="cart-header">
        <h3>🥕 당그니 장바구니</h3>
        <span class="close-btn" onclick="toggleCart()">&times;</span>
      </div>
      <ul id="cart-items" class="cart-items">
        <!-- 장바구니 아이템 담기는 곳 -->
      </ul>
      <div class="cart-footer">
        <p>총 금액: <span id="cart-total">0</span>원</p>
        <button class="checkout-btn" onclick="checkout()">주문하기</button>
      </div>
    </div>
  </div>

  <!-- 푸터 -->
  <footer>
    <p>&copy; 2026 Danggeuni Shop. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
