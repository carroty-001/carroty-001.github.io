<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>당그니네 밭</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="garden-bg" aria-hidden="true">
  <div class="side-crops left">🥕<br>🌿<br>🥕<br>🌱<br>🥕<br>🌼<br>🥕</div>
  <div class="side-crops right">🌼<br>🥕<br>🌱<br>🥕<br>🌿<br>🥕<br>🌼</div>
  <div class="field-bottom"><span>🌱</span><span>🥕</span><span>🌼</span><span>🥕</span><span>🌱</span><span>🥕</span><span>🌼</span></div>
</div>
<header>
  <div class="brand-wrap"><div class="brand"><span class="brand-carrot">🥕</span><span class="brand-bunny">🐰</span><div><b>당그니네 밭</b><small>DANGUNI FARM</small></div></div><span class="brand-sprout">🌿</span></div>
  <button id="favTop" class="icon-btn" aria-label="내 바구니">♡<i id="favCount">0</i></button>
</header>

<main>
  <section class="shop-notice" aria-label="쇼핑 안내">
    <b>전체 상태 필터를 '판매중'으로 변경 후 쇼핑해주세요</b>
    <span>'미판매' 상품의 경우 멤버십 미보유 계정에 있는 등의 사유로 아직 구매 불가한 아이템입니다. 추후 멤버십 결제시 구매 가능합니다.</span>
  </section>
  <div class="search-row">
    <label class="search">⌕ <input id="q" placeholder="어떤 작물을 찾고 있나요?"></label>
  </div>
  <div class="filters">
    <select id="category"><option value="전체">카테고리 전체</option></select>
    <select id="status"><option value="all">전체 상태</option><option value="selling">판매중</option><option value="soldout">판매완료</option><option value="unavailable">미판매</option></select>
  </div>
  <div class="summary"><b>🥕 총 <span id="total">0</span>개의 작물이 자라고 있어요!</b></div>
  <section id="grid" class="grid"></section>
  <section id="empty" class="empty" hidden><div>🥕</div><b>앗, 아직 이 밭에는 없어요!</b></section>
  <nav id="pages" class="pages"></nav>
</main>

<div id="detail" class="overlay" hidden>
 <div class="shade" data-close></div>
 <article class="sheet">
   <button class="close" data-close>×</button>
   <div class="hero"><span id="detailBadge"></span><button id="detailHeart" class="heart big"></button><img id="detailImg"></div>
   <div id="thumbs" class="thumbs"></div>
   <h2 id="detailName"></h2>
   <dl><div><dt>카테고리</dt><dd id="detailCat"></dd></div><div><dt>판매 상태</dt><dd id="detailStatus"></dd></div><div><dt>가격</dt><dd id="detailPrice"></dd></div></dl>
   <div class="actions"><button id="detailFav">♡ 찜하기</button><a id="kakao" target="_blank" rel="noopener">문의하기</a></div>
 </article>
</div>

<div id="favPanel" class="overlay" hidden>
 <div class="shade" data-fav-close></div>
 <article class="sheet fav-sheet">
   <div class="panel-head"><button data-fav-close>‹</button><h2>🧺 내 바구니</h2></div>
   <div id="favList"></div>
 </article>
</div>
<script src="script.js"></script>
</body></html>
