<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥕 당그니네 밭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body><div class="site-bg">
<header class="header">
  <a class="logo" href="#"><span class="logo-carrot">🥕</span><span><strong>당그니네 밭</strong><small>DANGNI FARM</small></span></a>
  <nav class="nav"><a href="#shop" class="active">SHOP</a></nav>
  <div class="header-actions"><button class="icon-btn" id="favoritesBtn" title="내 바구니">🧺 <span id="favoriteCount">0</span></button></div>
</header>
<main>
<section class="hero carrot-pattern-banner" id="shop" aria-label="당근 일러스트 배너">
  <div class="pattern-carrot pc1"><span>•ᴗ•</span></div>
  <div class="pattern-carrot pc2"><span>˶ᵔ ᵕ ᵔ˶</span></div>
  <div class="pattern-carrot pc3"><span>⌐■_■</span></div>
  <div class="pattern-carrot pc4"><span>•◡•</span></div>
  <div class="pattern-carrot pc5"><span>ᵔᴗᵔ</span></div>
  <div class="pattern-carrot pc6"><span>•̀ᴗ•́</span></div>
  <div class="pattern-carrot pc7"><span>◕ᴗ◕</span></div>
  <div class="pattern-carrot pc8"><span>•ᴗ•</span></div>
  <div class="pattern-carrot pc9"><span>˘◡˘</span></div>
</section>

<div class="notice-fixed"><b>전체 상태 필터를 '판매중'으로 변경 후 쇼핑해주세요</b>'미판매' 상품의 경우 멤버십 미보유 계정에 있는 등의 사유로 아직 구매 불가한 아이템입니다. 추후 멤버십 결제시 구매 가능합니다.</div>

<section class="shop-toolbar">
 <div class="search-wrap"><span>🔎</span><input id="searchInput" type="search" placeholder="어떤 작물을 찾고 있나요?" autocomplete="off"><button id="clearSearch" class="clear-search">×</button></div>
 <div class="filter-row">
  <div class="selects filter-selects">
    <label class="filter-box"><span>카테고리</span><select id="categoryFilter"></select></label>
    <label class="filter-box"><span>판매 상태</span><select id="statusFilter"></select></label>
  </div>
</div>
</section>

<div class="result-line"><b>🌱 총 <span id="resultCount">0</span>개의 작물이 자라고 있어요!</b></div>
<section class="content-grid"><div class="products-area" style="grid-column:1/-1"><div class="products-grid" id="products"></div>
<div class="empty-state hidden" id="emptyState"><div>🥕</div><h3>앗, 아직 이 밭에는 없어요!</h3></div>
<div class="pagination" id="pagination"></div></div></section>
</main>
</div>

<div class="modal hidden" id="productModal"><div class="modal-backdrop" data-close-modal></div><div class="modal-card">
<button class="modal-close" data-close-modal>×</button><div class="modal-image-wrap"><div class="modal-image" id="modalImage"></div></div>
<div class="modal-details"><div id="modalBadges"></div><div class="status-badge" id="modalStatus"></div><h2 id="modalName"></h2><div class="modal-price" id="modalPrice"></div><div class="tags" id="modalTags"></div>
<div class="product-meta"><div><span>상품번호</span><b id="modalId"></b></div><div><span>카테고리</span><b id="modalCategory"></b></div><div><span>등록일</span><b id="modalDate"></b></div></div>
<div class="modal-actions"><a class="primary-btn" id="modalContact" href="#" target="_blank">💬 문의하기</a><button class="secondary-btn" id="modalFavorite">♡ 찜하기</button></div></div></div></div>

<div class="favorite-panel hidden" id="favoritePanel"><div class="favorite-backdrop" data-fav-close></div><div class="favorite-card">
<div class="favorite-head"><h2>🧺 내 바구니</h2><button class="favorite-close" data-fav-close>×</button></div>
<div class="favorite-list" id="favoriteList"></div><button class="basket-inquiry" id="basketInquiry">담은 작물 한 번에 문의하기</button><div class="copy-hint" id="copyHint"></div></div></div>
<div class="toast" id="toast"></div><script src="script.js"></script></body></html>
